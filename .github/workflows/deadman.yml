name: 49-Hour Emergency Monitor
on:
  schedule:
    - cron: '0 * * * *' # Checks every hour
  workflow_dispatch:      # Allows manual testing

jobs:
  check-inactivity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to read git history

      - name: Calculate Hours Since Last Update
        id: hour_check
        run: |
          # Get timestamp of the last commit for status.txt
          LAST_COMMIT_SEC=$(git log -1 --format=%ct status.txt)
          NOW_SEC=$(date +%s)
          DIFF_HOURS=$(( (NOW_SEC - LAST_COMMIT_SEC) / 3600 ))
          
          echo "Hours since last check-in: $DIFF_HOURS"
          
          if [ $DIFF_HOURS -ge 0 ]; then 
            echo "EXPIRED=true" >> $GITHUB_OUTPUT
            echo "🧪 TEST MODE: Sending emergency email with vault attachment"
          fi

      - name: Send Emergency Email
        if: steps.hour_check.outputs.EXPIRED == 'true'
        run: |
          # Install mail utilities
          sudo apt-get update && sudo apt-get install -y msmtp msmtp-mta mailutils mutt
          
          # Configure msmtp for Gmail
          cat > ~/.msmtprc << 'EOF'
          account gmail
          host smtp.gmail.com
          port 587
          auth on
          user YOUR_GMAIL_ADDRESS@gmail.com
          password ${{ secrets.GMAIL_APP_PASSWORD }}
          from YOUR_GMAIL_ADDRESS@gmail.com
          tls on
          tls_starttls on
          tls_trust_file /etc/ssl/certs/ca-certificates.crt
          account default : gmail
          EOF
          
          chmod 600 ~/.msmtprc
          
          # Create email body with Base64-encoded vault file
          cat << EMAILEOF > email_body.txt
          ═══════════════════════════════════════════════════════════
          🚨 EMERGENCY NOTIFICATION 🚨
          ═══════════════════════════════════════════════════════════
          
          No check-in detected for 49+ hours.
          You have been designated to receive important information.
          
          ═══════════════════════════════════════════════════════════
          🔑 YOUR PASSWORD (Copy this entire line):
          ${{ secrets.VAULT_PASSWORD }}
          ═══════════════════════════════════════════════════════════
          
          � VAULT DATA INCLUDED BELOW (No download needed!)
          
          ═══════════════════════════════════════════════════════════
          
          📋 3 SIMPLE STEPS:
          
          ┌─────────────────────────────────────────────────────────┐
          │ STEP 1: Save the Vault Data (scroll down below)        │
          └─────────────────────────────────────────────────────────┘
             Scroll to find "---BEGIN VAULT DATA---"
             Copy EVERYTHING between BEGIN and END
             Paste into Notepad → Save as: vault-data.txt
             (Save to your Downloads folder)
          
          ┌─────────────────────────────────────────────────────────┐
          │ STEP 2: Decode the Vault File                          │
          └─────────────────────────────────────────────────────────┘
             Open PowerShell (search "PowerShell" in Windows Start)
             
             Copy and paste these 2 lines (press Enter after each):
             
             cd Downloads
             certutil -decode vault-data.txt vault-data.7z
             
             You should see "Input Length = ..., Output Length = ..."
             This creates the real vault file!
          
          ┌─────────────────────────────────────────────────────────┐
          │ STEP 3: Install 7-Zip and Extract                      │
          └─────────────────────────────────────────────────────────┘
             Download 7-Zip from: www.7-zip.org (2 minute install)
             
             Then in Downloads folder:
             1. Find vault-data.7z
             2. RIGHT-CLICK on it (don't double-click!)
             3. Choose "7-Zip" → "Extract Here"
             4. PASTE the password from above
             5. Your files appear!
          
          ═══════════════════════════════════════════════════════════
          
          ⚠️ TROUBLESHOOTING:
          • If certutil fails: Make sure you saved the file as .txt
          • If 7-Zip won't open: You must right-click, not double-click
          • If password doesn't work: Copy it exactly (no extra spaces)
          
          ═══════════════════════════════════════════════════════════
          Dead Man's Switch - Timestamp: $(date)
          ═══════════════════════════════════════════════════════════
          
          ---BEGIN VAULT DATA---
          EMAILEOF
          
          # Base64 encode the vault file and append to email body
          base64 -w 76 ./vault/emergency-vault.7z >> email_body.txt
          
          # Add closing marker
          cat << EMAILEOF >> email_body.txt
          ---END VAULT DATA---
          
          ═══════════════════════════════════════════════════════════
          Save this email! You need the password and vault data above.
          ═══════════════════════════════════════════════════════════
          EMAILEOF
          
          # Send email (no attachment needed - vault is in the body!)
          mutt -s "🚨 EMERGENCY: Vault Access Required" \
               -- ${{ secrets.BENEFICIARY_EMAIL }} < email_body.txt
          
          echo "✅ Email sent with Base64-encoded vault in email body"
          EMAILEOF
          
          echo "✅ Email sent successfully"
