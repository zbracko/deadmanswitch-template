name: 49-Hour Emergency Monitor
on:
  schedule:
    - cron: '0 * * * *' # Checks every hour
  workflow_dispatch:      # Allows manual testing

jobs:
  check-inactivity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to read git history

      - name: Calculate Hours Since Last Update
        id: hour_check
        run: |
          # Get timestamp of the last commit for status.txt
          LAST_COMMIT_SEC=$(git log -1 --format=%ct status.txt)
          NOW_SEC=$(date +%s)
          DIFF_HOURS=$(( (NOW_SEC - LAST_COMMIT_SEC) / 3600 ))
          
          echo "Hours since last check-in: $DIFF_HOURS"
          
          if [ $DIFF_HOURS -ge 0 ]; then 
            echo "EXPIRED=true" >> $GITHUB_OUTPUT
            echo "🧪 TEST MODE: Sending emergency email with vault attachment"
          fi

      - name: Send Emergency Email
        if: steps.hour_check.outputs.EXPIRED == 'true'
        run: |
          # Install mail utilities
          sudo apt-get update && sudo apt-get install -y msmtp msmtp-mta mailutils mutt
          
          # Configure msmtp for Gmail
          cat > ~/.msmtprc << 'EOF'
          account gmail
          host smtp.gmail.com
          port 587
          auth on
          user zibradev@gmail.com
          password ${{ secrets.GMAIL_APP_PASSWORD }}
          from zibradev@gmail.com
          tls on
          tls_starttls on
          tls_trust_file /etc/ssl/certs/ca-certificates.crt
          account default : gmail
          EOF
          
          chmod 600 ~/.msmtprc
          
          # Try creating a password-protected ZIP instead of 7z (Windows native support!)
          echo "� Creating password-protected ZIP file..."
          
          # Install zip utility
          sudo apt-get update && sudo apt-get install -y zip
          
          # Create password-protected ZIP (AES-256 encryption)
          cd vault
          zip -P "${{ secrets.VAULT_PASSWORD }}" -e ../emergency-vault.zip *
          cd ..
          
          echo "✅ ZIP file created with password protection"
          
          # Create simple email body
          cat << EMAILEOF > email_body.txt
          ═══════════════════════════════════════════════════════════
          🚨 EMERGENCY NOTIFICATION 🚨
          ═══════════════════════════════════════════════════════════
          
          No check-in detected for 49+ hours.
          You have been designated to receive important information.
          
          ═══════════════════════════════════════════════════════════
          🔑 YOUR PASSWORD (Copy this entire line):
          ${{ secrets.VAULT_PASSWORD }}
          ═══════════════════════════════════════════════════════════
          
          � VAULT FILE ATTACHED (emergency-vault.zip)
          
          ═══════════════════════════════════════════════════════════
          
          📋 SUPER SIMPLE 2-STEP PROCESS:
          
          ┌─────────────────────────────────────────────────────────┐
          │ STEP 1: Save the attached ZIP file from this email     │
          └─────────────────────────────────────────────────────────┘
             • Look for: emergency-vault.zip (attached to this email)
             • Save it to your Downloads folder
             • Windows can open ZIP files natively - no extra software!
          
          ┌─────────────────────────────────────────────────────────┐
          │ STEP 2: Extract with Password ⚠️ EASY!                 │
          └─────────────────────────────────────────────────────────┘
             1. Go to your Downloads folder
             2. RIGHT-CLICK on emergency-vault.zip
             3. Choose "Extract All..."
             4. PASTE the password from above when asked
             5. Your files appear! 🎉
          
          ═══════════════════════════════════════════════════════════
          
          ⚠️ IMPORTANT NOTES:
          • Save this email - you need the password
          • Windows handles ZIP files automatically (no software needed!)
          • Just right-click and choose "Extract All..."
          • Copy the password exactly (no extra spaces)
          
          ═══════════════════════════════════════════════════════════
          Dead Man's Switch - Timestamp: $(date)
          ═══════════════════════════════════════════════════════════
          EMAILEOF
          
          # Send email with ZIP file attached
          mutt -s "🚨 EMERGENCY: Vault Access Required" \
               -a emergency-vault.zip \
               -- ${{ secrets.BENEFICIARY_EMAIL }} < email_body.txt
          
