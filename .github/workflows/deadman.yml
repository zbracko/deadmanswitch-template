name: 49-Hour Emergency Monitor
on:
  schedule:
    - cron: '0 * * * *' # Checks every hour
  workflow_dispatch:      # Allows manual testing

permissions:
  contents: write  # Required to create releases

jobs:
  check-inactivity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to read git history

      - name: Calculate Hours Since Last Update
        id: hour_check
        run: |
          # Get timestamp of the last commit for status.txt
          LAST_COMMIT_SEC=$(git log -1 --format=%ct status.txt)
          NOW_SEC=$(date +%s)
          DIFF_HOURS=$(( (NOW_SEC - LAST_COMMIT_SEC) / 3600 ))
          
          echo "Hours since last check-in: $DIFF_HOURS"
          
          if [ $DIFF_HOURS -ge 0 ]; then 
            echo "EXPIRED=true" >> $GITHUB_OUTPUT
            echo "🧪 TEST MODE: Sending test email"
          fi

      - name: Create Emergency Release
        if: steps.hour_check.outputs.EXPIRED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TIMESTAMP=$(date +%s)
          RELEASE_TAG="emergency-$TIMESTAMP"
          
          echo "Creating emergency release: $RELEASE_TAG"
          
          # Create release with all vault files
          gh release create "$RELEASE_TAG" \
            ./vault/*.7z \
            ./vault/*.md \
            ./vault/*.txt \
            --title "🚨 Emergency Vault Access - $(date)" \
            --notes "Emergency access granted on $(date +%Y-%m-%d\ %H:%M:%S\ UTC). Password has been sent via email to authorized beneficiary." \
            --repo ${{ github.repository }}
          
          # Generate direct download URLs
          VAULT_URL="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/emergency-vault.7z"
          HOW_TO_URL="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/HOW-TO-OPEN.md"
          QUICK_START_URL="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/QUICK-START.txt"
          
          # Save URLs for email step
          echo "VAULT_URL=$VAULT_URL" >> $GITHUB_ENV
          echo "HOW_TO_URL=$HOW_TO_URL" >> $GITHUB_ENV
          echo "QUICK_START_URL=$QUICK_START_URL" >> $GITHUB_ENV
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          
          echo "✅ Release created successfully"
          echo "Vault URL: $VAULT_URL"

      - name: Send Emergency Email
        if: steps.hour_check.outputs.EXPIRED == 'true'
        run: |
          # Install mail utilities
          sudo apt-get update && sudo apt-get install -y msmtp msmtp-mta mailutils
          
          # Configure msmtp for Gmail
          cat > ~/.msmtprc << 'EOF'
          account gmail
          host smtp.gmail.com
          port 587
          auth on
          user zibradev@gmail.com
          password ${{ secrets.GMAIL_APP_PASSWORD }}
          from zibradev@gmail.com
          tls on
          tls_starttls on
          tls_trust_file /etc/ssl/certs/ca-certificates.crt
          account default : gmail
          EOF
          
          chmod 600 ~/.msmtprc
          
          # Send email with direct download links
          cat << EMAILEOF | mail -s "🚨 EMERGENCY: Vault Access Required" ${{ secrets.BENEFICIARY_EMAIL }}
          ═══════════════════════════════════════════════════════════
          🚨 EMERGENCY NOTIFICATION 🚨
          ═══════════════════════════════════════════════════════════
          
          No check-in detected for 49+ hours.
          You have been designated to receive important information.
          
          ═══════════════════════════════════════════════════════════
          🔑 YOUR PASSWORD (Copy this entire line):
          ${{ secrets.VAULT_PASSWORD }}
          ═══════════════════════════════════════════════════════════
          
          📥 DOWNLOAD FILES (NO LOGIN REQUIRED - Just click):
          
          ▶ VAULT FILE (Encrypted):
          $VAULT_URL
          
          ▶ INSTRUCTIONS (How to open):
          $HOW_TO_URL
          
          ▶ QUICK START GUIDE:
          $QUICK_START_URL
          
          ═══════════════════════════════════════════════════════════
          
          📋 3 SIMPLE STEPS:
          
          ┌─────────────────────────────────────────────────────────┐
          │ STEP 1: Click "VAULT FILE" link above                  │
          └─────────────────────────────────────────────────────────┘
             File downloads automatically. NO GitHub account needed!
          
          ┌─────────────────────────────────────────────────────────┐
          │ STEP 2: Install 7-Zip (Free software)                  │
          └─────────────────────────────────────────────────────────┘
             Go to: www.7-zip.org
             Takes 2 minutes, safe and free
          
          ┌─────────────────────────────────────────────────────────┐
          │ STEP 3: Extract with Password ⚠️ CRITICAL!             │
          └─────────────────────────────────────────────────────────┘
             ⚠️ DO NOT DOUBLE-CLICK THE FILE!
             
             Instead:
             1. Find file in Downloads folder
             2. RIGHT-CLICK on emergency-vault.7z
             3. Choose "7-Zip" → "Extract Here"
             4. PASTE password from above
             5. Files appear!
          
          ═══════════════════════════════════════════════════════════
          
          ⚠️ IMPORTANT:
          • Save this email - you need the password
          • All links work without GitHub account
          • MUST use 7-Zip (not Windows default)
          • MUST right-click, not double-click
          • Need help? Download instructions using links above
          
          ═══════════════════════════════════════════════════════════
          Dead Man's Switch - Release: $RELEASE_TAG
          ═══════════════════════════════════════════════════════════
          EMAILEOF
          
          echo "✅ Email sent successfully"
